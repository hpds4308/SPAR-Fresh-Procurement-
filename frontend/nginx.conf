server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Real files (JS, CSS, images) get served directly and cached hard —
    # Vite fingerprints filenames on every build, so this is always safe.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else (any route React Router handles client-side, like
    # /admin or /supplier) falls back to index.html — without this,
    # refreshing the page on any route other than "/" returns a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
