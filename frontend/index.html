<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPAR Sri Lanka — Procurement Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Boot splash: the SPAR loading animation (brand video with its black background
         keyed out), inline so it paints before the JS bundle arrives; the app calls
         window.__hideSplash() once the initial auth check has settled. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        transition: opacity 0.4s ease;
      }
      #boot-splash.sl-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash video,
      #boot-splash img {
        display: block;
        width: min(94vw, 720px);
        height: auto;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="progressbar" aria-label="Loading SPAR">
    </div>
    <script>
      (function () {
        var splash = document.getElementById("boot-splash");
        // Transparent VP9 WebM (~630 KB) everywhere it's supported; Safari and all iOS
        // browsers (WebKit) ignore WebM alpha, so they get the animated WebP instead.
        var ua = navigator.userAgent;
        var webkitOnly = /iPad|iPhone|iPod/.test(ua) || (/Safari/.test(ua) && !/Chrome|Chromium|Edg|Android/.test(ua));
        splash.innerHTML = webkitOnly
          ? '<img src="/images/spar-loader.webp" width="640" height="290" alt="" />'
          : '<video src="/videos/spar-loader.webm" width="720" height="326" autoplay muted loop playsinline></video>';
        var start = Date.now();
        var MIN_SHOW = 2000; // let the animation read even when the app loads instantly
        var done = false;
        window.__hideSplash = function () {
          if (done) return;
          done = true;
          setTimeout(function () {
            splash.classList.add("sl-done");
            setTimeout(function () { splash.remove(); }, 450);
          }, Math.max(0, MIN_SHOW - (Date.now() - start)));
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
