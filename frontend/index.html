<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPAR Sri Lanka — Procurement Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Boot splash: the SPAR produce-orbit loading video (upscaled to 1080p), inline so
         it paints before the JS bundle arrives; the app calls window.__hideSplash() once
         the initial auth check has settled. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eee; /* matches the video's studio backdrop at its edges */
        transition: opacity 0.4s ease;
      }
      #boot-splash.sl-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash video {
        display: block;
        width: min(100vw, 177.78vh); /* as large as fits, 16:9 */
        height: auto;
        /* feather the frame edges into the page so there's no visible box */
        -webkit-mask-image: radial-gradient(closest-side, #000 86%, transparent 100%);
        mask-image: radial-gradient(closest-side, #000 86%, transparent 100%);
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="progressbar" aria-label="Loading SPAR">
      <video width="1920" height="1080" autoplay muted loop playsinline preload="auto">
        <source src="/videos/spar-loader-hd.webm" type="video/webm" />
        <source src="/videos/spar-loader-hd.mp4" type="video/mp4" />
      </video>
    </div>
    <script>
      (function () {
        var splash = document.getElementById("boot-splash");
        var start = Date.now();
        var MIN_SHOW = 2000; // let the animation read even when the app loads instantly
        var done = false;
        window.__hideSplash = function () {
          if (done) return;
          done = true;
          setTimeout(function () {
            splash.classList.add("sl-done");
            setTimeout(function () { splash.remove(); }, 450);
          }, Math.max(0, MIN_SHOW - (Date.now() - start)));
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
