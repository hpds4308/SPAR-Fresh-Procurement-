[pytest]
# Run from this folder:  <venv>/python -m pytest -c qa/pytest.ini qa/backend
# Needs a Postgres reachable via DATABASE_URL (a "<db>_test" copy is created
# and migrated automatically by the app's own tests/conftest.py fixtures).
testpaths = backend
python_files = test_*.py
addopts = -ra --strict-markers
xfail_strict = false
