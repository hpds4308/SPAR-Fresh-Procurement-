services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: spar_user
      POSTGRES_PASSWORD: spar_password
      POSTGRES_DB: spar_procurement
    volumes:
      - spar_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spar_user -d spar_procurement"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://spar_user:spar_password@db:5432/spar_procurement
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # The seed scripts (seed_master_data.py, restore_pos_codes.py) look
      # for CSVs at a path relative to their own location that resolves to
      # /database/seed inside the container — but ./database sits next to
      # ./backend on the host, so without this mount it's simply not
      # reachable from inside the container at all. This was a real,
      # pre-existing gap, not specific to one script.
      - ./database:/database
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Reuses the backend image just to run scripts/import_harti_prices.py on
  # its own schedule — see that script for the daily run time and retry
  # behavior. Local market prices are informational only, so a failure
  # here never affects the main backend/frontend containers.
  harti-price-import:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://spar_user:spar_password@db:5432/spar_procurement
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    entrypoint: ["python", "-m", "scripts.import_harti_prices"]

  # Automated Keells retail price scrape — replaces running scraper.js by
  # hand and uploading its Excel output. Built from its own Dockerfile
  # (needs a real headless Chromium + OS deps) rather than reusing the
  # backend image like harti-price-import does. See
  # scripts/import_keells_prices.py for the daily run time and retry
  # behavior; admin can also trigger an immediate run from the Keells
  # Price tab without waiting for this schedule.
  keells-price-import:
    build:
      context: ./backend
      dockerfile: Dockerfile.keells-scrape
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://spar_user:spar_password@db:5432/spar_procurement
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    restart: unless-stopped
    # VITE_API_BASE_URL comes from frontend/.env — Vite loads it
    # automatically, no Compose wiring needed (see frontend/.env.example).
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  spar_db_data:
