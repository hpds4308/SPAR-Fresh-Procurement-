# Production stack. Needs three env files filled in first, each copied
# from its own .env.example — see docs/HOSTING.md:
#   .env.production                  (this directory — Compose itself)
#   backend/.env.production          (backend app config)
#   frontend/.env.production         (frontend app config, read at build time)
#
# Usage on the server:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml exec backend alembic upgrade head
#
# Key differences from docker-compose.yml (local dev):
#   - Postgres port is NOT published — only reachable inside the Docker
#     network, never from the internet.
#   - Backend port is NOT published either — only Caddy talks to it.
#   - Frontend builds real static files (Dockerfile.prod) instead of
#     running the dev server, and is served by nginx.
#   - Caddy sits in front of both and gets you free, automatic HTTPS —
#     just point your domain's DNS at the server and it handles the rest.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: spar_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: spar_procurement
    volumes:
      - spar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spar_user -d spar_procurement"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    labels:
      - "autoheal=true"
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_URL: postgresql+psycopg2://spar_user:${POSTGRES_PASSWORD}@db:5432/spar_procurement
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Same reason as docker-compose.yml: the seed scripts need
      # /database/seed inside the container, and it's not part of the
      # backend build context, so it needs an explicit mount.
      - ./database:/database
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    labels:
      - "autoheal=true"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Docker's own HEALTHCHECK only ever reports status — it does not act on
  # it. A hung-but-still-running backend/frontend process would sit there
  # marked "unhealthy" forever without this: autoheal watches containers
  # labeled autoheal=true and kills them once unhealthy, so `restart:
  # unless-stopped` above actually brings them back.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Reuses the postgres image purely for pg_dump — no host cron job to set
  # up and forget. See docs/HOSTING.md for how to restore from one of
  # these dumps.
  db-backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: spar_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: spar_procurement
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./docker/backup_db.sh:/backup_db.sh:ro
      - db_backups:/backups
    entrypoint: ["sh", "/backup_db.sh"]

  # Reuses the backend image just to run scripts/import_harti_prices.py on
  # its own daily schedule — informational-only local market prices, so a
  # failure here never affects the main backend/frontend containers.
  harti-price-import:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_URL: postgresql+psycopg2://spar_user:${POSTGRES_PASSWORD}@db:5432/spar_procurement
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["python", "-m", "scripts.import_harti_prices"]

  # Automated Keells retail price scrape — replaces running scraper.js by
  # hand and uploading its Excel output. See docker-compose.yml for why
  # this builds from its own Dockerfile instead of reusing the backend
  # image.
  keells-price-import:
    build:
      context: ./backend
      dockerfile: Dockerfile.keells-scrape
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_URL: postgresql+psycopg2://spar_user:${POSTGRES_PASSWORD}@db:5432/spar_procurement
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  spar_db_data:
  caddy_data:
  caddy_config:
  db_backups:
