# Production stack. Run alongside .env.production (copy .env.example,
# fill in real values — see docs/HOSTING.md).
#
# Usage on the server:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec backend alembic upgrade head
#
# Key differences from docker-compose.yml (local dev):
#   - Postgres port is NOT published — only reachable inside the Docker
#     network, never from the internet.
#   - Backend port is NOT published either — only Caddy talks to it.
#   - Frontend builds real static files (Dockerfile.prod) instead of
#     running the dev server, and is served by nginx.
#   - Caddy sits in front of both and gets you free, automatic HTTPS —
#     just point your domain's DNS at the server and it handles the rest.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: spar_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: spar_procurement
    volumes:
      - spar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spar_user -d spar_procurement"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+psycopg2://spar_user:${POSTGRES_PASSWORD}@db:5432/spar_procurement
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Same reason as docker-compose.yml: the seed scripts need
      # /database/seed inside the container, and it's not part of the
      # backend build context, so it needs an explicit mount.
      - ./database:/database

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${PUBLIC_URL}
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  spar_db_data:
  caddy_data:
  caddy_config:
